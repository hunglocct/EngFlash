<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Cá Nhân | Eng Flash</title>
    <meta name="description" content="Chỉnh sửa thông tin cá nhân và ảnh đại diện">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4338ca;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #06b6d4;
            --success: #10b981;
            --bg-base: #0b0b1a;
            --bg-card: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-nav {
            background: rgba(11, 11, 26, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            height: 56px;
            display: flex; align-items: center;
        }
        .navbar-brand {
            font-weight: 700; font-size: 1.1rem; color: #fff;
            text-decoration: none;
            display: flex; align-items: center; gap: 8px;
        }
        .brand-logo {
            width: 30px; height: 30px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }

        /* ─── PROFILE CONTAINER ─── */
        .profile-container {
            max-width: 650px;
            margin: 4rem auto;
            width: 90%;
        }

        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }

        /* Vòng tròn xem trước Avatar */
        .avatar-preview-wrapper {
            position: relative;
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 3px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            font-size: 3.2rem;
            overflow: hidden;
            margin-bottom: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: border-color 0.3s;
        }
        .avatar-preview-wrapper img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* Hộp chọn Preset Avatars */
        .presets-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 1rem;
        }
        .preset-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .preset-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.1);
        }
        .preset-btn.active {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.15);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* ─── FORM CONTROLS ─── */
        .form-label {
            font-size: 0.75rem; font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.08em;
            margin-bottom: 0.4rem;
        }
        .form-control {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            border-radius: 12px; color: var(--text-primary);
            padding: 0.75rem 1rem; font-size: 0.95rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.07);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            color: var(--text-primary);
        }

        .btn-update {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 700;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
        }
        .btn-update:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            opacity: 0.95;
        }

        /* TOAST */
        .toast-host {
            position: fixed; top: 72px; right: 1.25rem;
            z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem;
        }
        .toast-item {
            backdrop-filter: blur(12px);
            border-radius: 12px; padding: 0.8rem 1.15rem;
            color: #fff; font-size: 0.85rem; font-weight: 500;
            min-width: 270px;
            animation: toastIn 0.3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .toast-item.success { background: rgba(16, 185, 129, 0.9); border: 1px solid rgba(16, 185, 129, 0.4); }
        .toast-item.danger  { background: rgba(239, 68, 68, 0.9); border: 1px solid rgba(239, 68, 68, 0.4); }
        @keyframes toastIn { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:none} }
    </style>
</head>
<body>

<!-- ══ NAVBAR ══ -->
<nav class="main-nav">
    <div class="container d-flex align-items-center">
        <a class="navbar-brand" href="../index.html">
            <img src="../src/logo.png" alt="Eng Flash Logo" style="height:32px; margin-right: 8px;">
            Eng Flash
        </a>
        <a href="main.html" class="btn btn-sm btn-outline-light ms-3 px-3">
            <i class="bi bi-arrow-left"></i> Quay lại chuyên đề
        </a>
        <div class="ms-auto" id="navbar-user"></div>
    </div>
</nav>

<div class="toast-host" id="toast-host"></div>

<!-- ══ HỒ SƠ ══ -->
<div class="profile-container">
    <div class="profile-card">
        <h3 class="fw-bold mb-4 text-center">Hồ Sơ Cá Nhân</h3>
        
        <form id="profile-form" onsubmit="updateProfile(event)">
            <!-- Avatar Section -->
            <div class="avatar-section">
                <div class="avatar-preview-wrapper" id="avatar-preview-box">
                    <!-- Sẽ render avatar mặc định hoặc hình ảnh -->
                </div>
                
                <span class="small text-muted mb-2">Chọn ảnh đại diện mẫu:</span>
                
                <!-- Preset Avatars -->
                <div class="presets-grid" id="presets-grid">
                    <button type="button" class="preset-btn" data-preset="preset1" onclick="selectPreset('preset1')">🧑‍🎓</button>
                    <button type="button" class="preset-btn" data-preset="preset2" onclick="selectPreset('preset2')">🧑‍🏫</button>
                    <button type="button" class="preset-btn" data-preset="preset3" onclick="selectPreset('preset3')">🧑‍💻</button>
                    <button type="button" class="preset-btn" data-preset="preset4" onclick="selectPreset('preset4')">🦊</button>
                    <button type="button" class="preset-btn" data-preset="preset5" onclick="selectPreset('preset5')">🦁</button>
                    <button type="button" class="preset-btn" data-preset="preset6" onclick="selectPreset('preset6')">🐼</button>
                </div>
                
                <span class="small text-muted mb-2">Hoặc tự tải ảnh lên:</span>
                <input type="file" class="form-control form-control-sm" id="inputAvatarFile" accept="image/*" onchange="handleImageUpload(event)" style="max-width: 250px">
            </div>

            <!-- Basic Info Form -->
            <div class="mb-3">
                <label class="form-label" for="inputName">Họ và Tên</label>
                <input type="text" class="form-control" id="inputName" placeholder="Nhập tên hiển thị..." required>
            </div>

            <div class="mb-4">
                <label class="form-label" for="inputBirthdate">Ngày sinh</label>
                <input type="date" class="form-control" id="inputBirthdate">
            </div>

            <button type="submit" class="btn-update" id="btn-submit-profile">
                <i class="bi bi-check2-circle me-1"></i> Lưu thông tin
            </button>
        </form>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script>
    // Guard
    const user = checkLogin();
    if (!user) throw new Error("Redirect to login");
    renderNavbarUser();

    // State
    let selectedAvatar = user.avatar || "preset1";
    const presetEmojis = {
        preset1: "🧑‍🎓",
        preset2: "🧑‍🏫",
        preset3: "🧑‍💻",
        preset4: "🦊",
        preset5: "🦁",
        preset6: "🐼"
    };

    // Khởi tạo form
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("inputName").value = user.name || user.username || "";
        document.getElementById("inputBirthdate").value = user.birthdate || "";
        updateAvatarPreview();
        highlightActivePreset();
    });

    function highlightActivePreset() {
        document.querySelectorAll(".preset-btn").forEach(btn => {
            if (btn.dataset.preset === selectedAvatar) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        });
    }

    function selectPreset(presetId) {
        selectedAvatar = presetId;
        // Xoá file upload nếu có
        document.getElementById("inputAvatarFile").value = "";
        updateAvatarPreview();
        highlightActivePreset();
    }

    function updateAvatarPreview() {
        const previewBox = document.getElementById("avatar-preview-box");
        if (selectedAvatar.startsWith("data:image/")) {
            previewBox.innerHTML = `<img src="${selectedAvatar}" alt="Avatar">`;
        } else if (presetEmojis[selectedAvatar]) {
            previewBox.innerHTML = presetEmojis[selectedAvatar];
        } else {
            previewBox.innerHTML = "🧑‍🎓";
        }
    }

    // Nén ảnh tải lên bằng Canvas thành dạng nhẹ (avatar 120px)
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        // Chỉ nhận ảnh
        if (!file.type.startsWith("image/")) {
            showToast("Vui lòng chỉ chọn tệp hình ảnh!", "danger");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement("canvas");
                const MAX_WIDTH = 120;
                const MAX_HEIGHT = 120;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                } else {
                    if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                // Lưu base64 chất lượng 0.8
                selectedAvatar = canvas.toDataURL("image/jpeg", 0.8);
                updateAvatarPreview();
                
                // Bỏ highlight preset
                document.querySelectorAll(".preset-btn").forEach(btn => btn.classList.remove("active"));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // Cập nhật thông tin profile lên Supabase
    async function updateProfile(event) {
        event.preventDefault();
        const btn = document.getElementById("btn-submit-profile");
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Đang cập nhật...`;

        const name = document.getElementById("inputName").value.trim();
        const birthdate = document.getElementById("inputBirthdate").value;

        try {
            const updatedUser = await SupabaseDB.update("users", user.id, {
                name: name,
                birthdate: birthdate,
                avatar: selectedAvatar
            });
            
            // Cập nhật session localStorage
            saveSession(updatedUser);
            
            showToast("✅ Đã cập nhật thông tin cá nhân thành công!", "success");
            
            // Re-render navbar
            renderNavbarUser();

            setTimeout(() => {
                window.location.href = "main.html";
            }, 1000);

        } catch (err) {
            console.error(err);
            showToast("❌ Không thể cập nhật thông tin cá nhân. Hãy thử lại.", "danger");
            btn.disabled = false;
            btn.innerHTML = `<i class="bi bi-check2-circle me-1"></i> Lưu thông tin`;
        }
    }

    function showToast(msg, type = "success") {
        const host = document.getElementById("toast-host");
        if (!host) return;
        const t = document.createElement("div");
        t.className = `toast-item ${type}`;
        t.innerHTML = msg;
        host.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }
</script>
</body>
</html>
