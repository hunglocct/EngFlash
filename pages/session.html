<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lộ Trình Học Tập | Eng Flash</title>
    <meta name="description" content="Danh sách bài học và tiến trình lộ trình học tập tuần tự">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4338ca;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --accent: #06b6d4;
            --accent-gold: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --bg-base: #0b0b1a;
            --bg-card: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ───────────── NAVBAR ───────────── */
        .main-nav {
            background: rgba(11, 11, 26, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 1000;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.15rem;
            color: #fff !important;
            display: flex; align-items: center; gap: 8px;
        }
        .brand-logo {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }

        /* ───────────── HERO ───────────── */
        .hero-section {
            background: linear-gradient(135deg, rgba(99,102,241,0.12) 0%, rgba(6,182,212,0.08) 100%);
            border-bottom: 1px solid var(--glass-border);
            padding: 3rem 0 2rem;
            position: relative;
            overflow: hidden;
        }
        .hero-title {
            font-size: 2rem;
            font-weight: 800;
        }
        .hero-title span {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ───────────── TIMELINE ROADMAP ───────────── */
        .roadmap-container {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .roadmap-line {
            position: absolute;
            left: 30px; top: 0; bottom: 0;
            width: 4px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 1;
            border-radius: 2px;
        }

        .roadmap-step {
            position: relative;
            display: flex;
            gap: 20px;
            margin-bottom: 2.5rem;
            z-index: 2;
        }

        .step-indicator {
            width: 24px; height: 24px;
            border-radius: 50%;
            background: #161633;
            border: 4px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            margin-top: 18px;
            margin-left: 14px;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .roadmap-step.completed .step-indicator {
            background: var(--success);
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
        }

        .roadmap-step.active .step-indicator {
            background: var(--primary);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .roadmap-step.locked .step-indicator {
            background: #0f0f23;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .step-card {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            transition: all 0.25s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .roadmap-step.unlocked .step-card:hover {
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.35);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .roadmap-step.locked .step-card {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .step-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 0.5rem;
        }

        .step-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .step-badge {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 99px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .step-badge.completed { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.2); }
        .step-badge.learning { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.2); }
        .step-badge.locked { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); }

        .step-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .step-progress-wrapper {
            margin-top: auto;
        }
        .step-progress-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
            display: flex; justify-content: space-between;
        }
        .step-progress-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            overflow: hidden;
        }
        .step-progress-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .toast-host {
            position: fixed; top: 72px; right: 1.25rem;
            z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem;
        }
        .toast-item {
            backdrop-filter: blur(12px);
            border-radius: 12px; padding: 0.8rem 1.15rem;
            color: #fff; font-size: 0.85rem; font-weight: 500;
            min-width: 270px; max-width: 340px;
            animation: toastIn 0.3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            background: rgba(99, 102, 241, 0.9);
            border: 1px solid rgba(99, 102, 241, 0.4);
        }
        .step-scores {
            margin-top: 0.75rem;
            padding-top: 0.6rem;
            border-top: 1px dashed rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .step-scores .badge {
            font-size: 0.72rem;
            font-weight: 500;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
        }
        body.light-theme .step-scores {
            border-top: 1px dashed rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body>

<!-- ══ NAVBAR ══ -->
<nav class="main-nav navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="../index.html">
            <img src="../src/logo.png" alt="Eng Flash Logo" style="height:32px; margin-right: 8px;">
            Eng Flash
        </a>
        <a href="main.html" class="btn btn-sm btn-outline-light ms-3 px-3">
            <i class="bi bi-arrow-left"></i> Quay lại Khoá học
        </a>
        <div class="ms-auto" id="navbar-user"></div>
    </div>
</nav>

<!-- ══ TOAST HOST ══ -->
<div class="toast-host" id="toast-host"></div>

<!-- ══ HERO ══ -->
<section class="hero-section">
    <div class="container">
        <h1 class="hero-title">
            Khoá Học: <span id="session-title-label">Đang tải...</span> 🚀
        </h1>
        <p class="" style="font-size:0.95rem" id="roadmap-desc;">
            Học viên: <strong id="user-display-name" class="text-white">...</strong> — Cố gắng học tập.
        </p>
    </div>
</section>

<!-- ══ MAIN ROUTE TIMELINE ══ -->
<main class="container my-5 flex-grow-1">
    <div class="roadmap-container">
        <div class="roadmap-line"></div>
        <div id="roadmap-list">
            <div class="text-center py-5 text-muted">
                <div class="spinner-border text-primary spinner-border-sm mb-3"></div>
                <p>Đang tải lộ trình học tập của bạn...</p>
            </div>
        </div>
    </div>
</main>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script>
    // Khởi tạo
    const currentUser = checkLogin();
    if (!currentUser) throw new Error("Redirect to login");
    renderNavbarUser();
    initTheme();

    document.getElementById("user-display-name").textContent = currentUser.name || currentUser.username;
    
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("sessionId");

    if (!sessionId) {
        alert("Khoá Học không hợp lệ! Đang quay lại trang chủ.");
        window.location.replace("main.html");
    }

    // Nếu học viên được bật Bỏ qua tuần tự
    if (currentUser.bypassSequence === true) {
        document.getElementById("roadmap-desc").innerHTML = `<span class="badge bg-success"><i class="bi bi-unlock-fill me-1"></i>Chế độ học tự do: Đã tắt khóa tuần tự</span>`;
    }

    window.addEventListener("DOMContentLoaded", loadRoadmap);

    async function loadRoadmap() {
        try {
            // Tải Chuyên đề, bài học và tiến trình của học viên
            const [dbUser, sessionObj, courses, progressList] = await Promise.all([
                SupabaseDB.getById("users", currentUser.id),
                SupabaseDB.getById("sessions", sessionId),
                SupabaseDB.getAll("courses", { sessionId: `eq.${sessionId}` }),
                SupabaseDB.getAll("progress", { userId: `eq.${currentUser.id}` })
            ]);

            if (dbUser) {
                saveSession(dbUser);
                currentUser.enrolledSessions = dbUser.enrolledSessions;
                currentUser.bypassSequence = dbUser.bypassSequence;
                currentUser.name = dbUser.name || dbUser.username;
            }

            if (!sessionObj) {
                alert("Khoá Học này không tồn tại hoặc đã bị ẩn!");
                window.location.replace("main.html");
                return;
            }

            if (sessionObj.isActive === false) {
                alert("Khoá Học này hiện đang tạm ẩn!");
                window.location.replace("main.html");
                return;
            }

            // KIỂM TRA PHÂN QUYỀN TRUY CẬP CHUYÊN ĐỀ (enrolledSessions)
            if (currentUser.role !== "admin" && currentUser.role !== "teacher") {
                const enrolledSessions = Array.isArray(currentUser.enrolledSessions) ? currentUser.enrolledSessions : [];
                if (!enrolledSessions.includes(sessionId)) {
                    alert("Bạn không được phân quyền học Khoá Học này! Vui lòng liên hệ Admin.");
                    window.location.replace("main.html");
                    return;
                }
            }

            // Cập nhật tên chuyên đề lên giao diện
            document.getElementById("session-title-label").textContent = sessionObj.name;

            // 1. Lọc các bài học đang được kích hoạt (isActive !== false)
            const activeCourses = courses.filter(c => c.isActive !== false);
            activeCourses.sort((a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0));

            const progressMap = {};
            progressList.forEach(p => { progressMap[p.courseId] = p; });

            renderTimeline(activeCourses, progressMap);

        } catch (err) {
            console.error("Lỗi tải lộ trình:", err);
            document.getElementById("roadmap-list").innerHTML = `
                <div class="text-center py-5">
                    <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
                    <h5 class="mt-3">Không thể kết nối cơ sở dữ liệu</h5>
                    <p class="text-muted small">Vui lòng kiểm tra lại sau.</p>
                </div>`;
        }
    }

    function renderTimeline(courses, progressMap) {
        const listContainer = document.getElementById("roadmap-list");

        if (courses.length === 0) {
            listContainer.innerHTML = `
                <div class="text-center py-5 text-muted">
                    <i class="bi bi-journal-x fs-1"></i>
                    <h5 class="mt-3">Chưa có bài học nào</h5>
                    <p class="small">Bạn chưa được phân quyền bài học nào hoặc không có bài học được kích hoạt.</p>
                </div>`;
            return;
        }

        let html = "";
        
        for (let i = 0; i < courses.length; i++) {
            const course = courses[i];
            const prog = progressMap[course.id];
            
            // XÁC ĐỊNH BÀI HỌC CÓ ĐƯỢC MỞ KHÓA KHÔNG:
            // - Nếu user được bật bypassSequence === true → luôn mở khóa tất cả.
            // - i === 0 (Bài đầu tiên) → luôn mở khóa.
            // - i > 0 → mở khóa khi bài (i-1) đã hoàn thành (isCompleted === true).
            const isUnlocked = (currentUser.bypassSequence === true) || 
                               (i === 0) || 
                               (i > 0 && progressMap[courses[i-1].id]?.isCompleted === true);
            
            const percent = prog ? calcPercent(prog.currentTime, course.duration) : 0;
            const completed = prog?.isCompleted || false;
            const hasStarted = percent > 0 || prog?.quizDone || prog?.homeworkSubmitted || prog?.practiceSubmitted;

            let stepClass = "locked";
            let badgeHtml = `<span class="step-badge locked"><i class="bi bi-lock-fill"></i> Bị khóa</span>`;
            
            if (isUnlocked) {
                if (completed) {
                    stepClass = "completed";
                    badgeHtml = `<span class="step-badge completed"><i class="bi bi-check-circle-fill"></i> Hoàn thành</span>`;
                } else if (hasStarted) {
                    stepClass = "active";
                    badgeHtml = `<span class="step-badge learning"><i class="bi bi-play-circle-fill"></i> Đang học</span>`;
                } else {
                    stepClass = "active";
                    badgeHtml = `<span class="step-badge learning" style="background: rgba(255,255,255,0.05); color: var(--text-primary); border-color: var(--glass-border)"><i class="bi bi-play-fill"></i> Sẵn sàng</span>`;
                }
            }

            const duration = course.duration ? `${Math.floor(course.duration / 60)} phút` : "Tự động đo";
            const hasQuiz = Array.isArray(course.quiz) && course.quiz.length > 0;
            const unlockCondition = hasQuiz 
                ? `<span title="Bài học có Quiz, yêu cầu làm Quiz để hoàn thành"><i class="bi bi-patch-question text-info"></i> Yêu cầu: Làm Quiz</span>` 
                : `<span title="Bài học không có Quiz, yêu cầu xem video ≥ 90% để hoàn thành"><i class="bi bi-play-btn text-accent"></i> Yêu cầu: Xem Video</span>`;

            const progressBar = (isUnlocked && hasStarted) ? `
                <div class="step-progress-wrapper">
                    <div class="step-progress-label">
                        <span>Tiến trình học</span>
                        <span>${percent}%</span>
                    </div>
                    <div class="step-progress-track">
                        <div class="step-progress-fill" style="width:${percent}%"></div>
                    </div>
                </div>` : "";

            let scoresHtml = "";
            if (isUnlocked) {
                const quizText = hasQuiz 
                    ? (prog?.quizDone ? `<span class="badge bg-success-subtle text-success border border-success-subtle">Quiz: ${prog.quizScore}%</span>` : `<span class="badge bg-warning-subtle text-warning border border-warning-subtle">Quiz: Chưa làm</span>`)
                    : "";
                
                let hwText = "";
                if (prog?.homeworkSubmitted) {
                    hwText = (prog.homeworkScore !== null && prog.homeworkScore !== undefined)
                        ? `<span class="badge bg-info-subtle text-info border border-info-subtle">BTVN: ${prog.homeworkScore}/10</span>`
                        : `<span class="badge bg-warning-subtle text-warning border border-warning-subtle">BTVN: Chờ chấm</span>`;
                } else {
                    hwText = `<span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle">BTVN: Chưa nộp</span>`;
                }

                let practiceText = "";
                if (prog?.practiceSubmitted) {
                    practiceText = (prog.practiceScore !== null && prog.practiceScore !== undefined)
                        ? `<span class="badge bg-info-subtle text-info border border-info-subtle">Thực hành: ${prog.practiceScore}/10</span>`
                        : `<span class="badge bg-warning-subtle text-warning border border-warning-subtle">Thực hành: Chờ chấm</span>`;
                } else {
                    practiceText = `<span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle">Thực hành: Chưa nộp</span>`;
                }

                let commentHtml = "";
                if (prog?.teacherComment) {
                    commentHtml = `<div class="text-info mt-2" style="font-size:0.75rem; font-style:italic"><i class="bi bi-chat-left-text me-1"></i>Nhận xét: "${escapeHtml(prog.teacherComment)}"</div>`;
                }

                scoresHtml = `
                    <div class="step-scores">
                        <span class="text-muted small me-1">Điểm:</span>
                        ${quizText}
                        ${hwText}
                        ${practiceText}
                        ${commentHtml}
                    </div>
                `;
            }

            html += `
                <div class="roadmap-step ${stepClass} ${isUnlocked ? 'unlocked' : 'locked'}">
                    <div class="step-indicator"></div>
                    <a href="${isUnlocked ? `lesson.html?id=${course.id}&sessionId=${sessionId}` : '#'}" class="step-card">
                        <div class="step-header">
                            <h3 class="step-title">${indexLabel(i + 1)}. ${course.title}</h3>
                            ${badgeHtml}
                        </div>
                        <div class="step-meta">
                            <span><i class="bi bi-clock me-1"></i>${duration}</span>
                            <span>•</span>
                            ${unlockCondition}
                        </div>
                        ${progressBar}
                        ${scoresHtml}
                    </a>
                </div>
            `;
        }

        listContainer.innerHTML = html;
    }

    // Hash đơn giản tạo icon ngẫu nhiên từ id
    function hashCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        return hash;
    }

    function indexLabel(num) {
        return String(num).padStart(2, '0');
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
